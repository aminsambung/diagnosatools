name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # --- MEMBUAT KEYSTORE OTOMATIS ---
    - name: Generate Keystore
      run: |
        keytool -genkeypair -v -keystore app/release.keystore -alias obdkey -keyalg RSA -keysize 2048 -validity 10000 -storepass obd123456 -keypass obd123456 -dname "CN=OBDLite, OU=Dev, O=Dev, L=City, S=State, C=ID"

    # --- BUILD RELEASE ---
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    # --- UPLOAD APK ---
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OBDLite-Release-APK
        path: app/build/outputs/apk/release/*.apk
