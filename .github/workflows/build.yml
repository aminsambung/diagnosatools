name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout kode dari repositori
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Java JDK 17 (Dibutuhkan oleh Gradle versi baru)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Setup Gradle dengan caching agar build selanjutnya lebih cepat
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. PERBAIKAN: Beri izin eksekusi pada file gradlew
    # Ini mencegah error "Permission denied" (Exit code 126)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Build APK versi Debug
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # 6. Upload hasil APK agar bisa diunduh
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OBDLite-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7 # File APK disimpan di GitHub selama 7 hari
        if-no-files-found: error # Gagal jika APK tidak terbentuk (membantu debugging)
